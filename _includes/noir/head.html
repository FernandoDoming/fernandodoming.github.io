<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141413">

  <title>
    {%- unless page.layout == "noir-home" or page.layout == "home" -%}
      {{ page.title | append: " · " }}
    {%- endunless -%}
    {{ site.title }}
  </title>

  {% seo %}

  {% include favicons.html %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ site.noir_stylesheet | default: '/assets/css/noir.css' | relative_url }}">

  {% if jekyll.environment == 'production' and site.google_analytics.id %}
    {% include google-analytics.html %}
  {% endif %}
</head>
